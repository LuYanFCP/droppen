<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Droppen</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <!-- Shown by the app while it starts Droppen on this device, and if that
         fails. The web app replaces it as soon as the server is up. -->
    <main>
      <svg class="mark" viewBox="1 1 30 30" aria-hidden="true"><path d="M3 3H16A13 13 0 1 1 3 16Z" /></svg>
      <h1>Droppen</h1>
      <p id="status" role="status" aria-live="polite"></p>
      <pre id="detail" hidden></pre>
      <div id="actions" hidden>
        <button id="retry" type="button"></button>
        <button id="logs" type="button" class="quiet"></button>
      </div>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
